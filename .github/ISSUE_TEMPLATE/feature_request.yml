name: Feature request
description: Propose an improvement that fits Caissa's current scope.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What player or maintainer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Contract and scope impact
      description: Mention REST, Socket.IO, persistence, frontend, or documentation changes.
