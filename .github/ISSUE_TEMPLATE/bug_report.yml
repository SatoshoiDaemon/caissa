name: Bug report
description: Report a reproducible problem in Caissa.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please avoid posting secrets, session cookies, recovery codes, or security vulnerabilities here. Use SECURITY.md for sensitive reports.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the local services...
        2. Open...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Python version, commit
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets and personal data before attaching.
