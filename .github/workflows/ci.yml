name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: make test

      - name: Check formatting and lint
        run: make lint

      - name: Run security scan
        run: make security

      - name: Check frontend JavaScript syntax
        shell: bash
        run: find src/frontend/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
